<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Eye - Privacy Filter</title>
<style>
:root {
    --primary: #ff2800;
    --primary-hover: #cc2000;
    --bg: #1a1a1a;
    --card-bg: #262626;
    --text: #eee;
    --text-muted: #aaa;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); 
    color: var(--text); 
    padding: 15px;
    line-height: 1.5;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

h1 { 
    margin-bottom: 10px; 
    color: var(--primary); 
    font-size: 1.8rem;
    text-align: center;
}

.description { 
    color: var(--text-muted); 
    font-size: 0.9rem; 
    margin-bottom: 20px; 
    border-left: 3px solid #00ddff; 
    padding-left: 12px; 
}

.card {
    background: var(--card-bg);
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

input[type="file"] {
    display: block;
    width: 100%;
    margin-bottom: 15px;
    color: var(--text-muted);
}

/* Custom file upload styling for mobile touch */
input[type="file"]::file-selector-button {
    background: #444;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    margin-right: 10px;
    font-size: 0.9rem;
}

.control-group {
    margin-bottom: 12px;
}

label { 
    display: flex; 
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
}

input[type=number] { 
    width: 80px; 
    padding: 6px;
    background: #333;
    border: 1px solid #555;
    color: white;
    border-radius: 4px;
    text-align: center;
    font-size: 1rem;
}

.btn-container {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button { 
    flex: 1;
    padding: 12px; 
    background: var(--primary); 
    border: none; 
    color: white; 
    cursor: pointer; 
    font-weight: bold; 
    font-size: 1rem;
    border-radius: 6px;
    touch-action: manipulation; /* Optimizes mobile tap delay */
}

button:hover { background: var(--primary-hover); }

#downloadBtn {
    background: #0088cc;
}
#downloadBtn:hover {
    background: #006699;
}
#downloadBtn:disabled {
    background: #444;
    color: #777;
    cursor: not-allowed;
}

.canvas-container {
    text-align: center;
    margin-top: 10px;
}

canvas { 
    border: 1px solid #555; 
    image-rendering: pixelated; 
    max-width: 100%; /* Keeps canvas fluid on small screens */
    height: auto;
    border-radius: 4px;
    background: #000;
}
</style>
</head>
<body>

<div class="container">
    <h1>Red Eye</h1>
    <div class="description">
        <strong>Privacy Filter Tool:</strong> This application converts images into a scrambled pattern. 
        The hidden content becomes visible only when decoded by wearing glasses with red-colored lenses.
    </div>

    <div class="card">
        <input type="file" id="fileInput" accept="image/*">

        <div class="control-group">
            <label>Curve (%): <input type="number" id="curve" min="50" max="200" value="100"></label>
        </div>
        <div class="control-group">
            <label>Dithering (%): <input type="number" id="dither" min="0" max="200" value="100"></label>
        </div>
        <div class="control-group">
            <label>Noise (%): <input type="number" id="noise" min="0" max="200" value="30"></label>
        </div>

        <div class="btn-container">
            <button id="applyBtn">Apply Filter</button>
            <button id="downloadBtn" disabled>Download Image</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const applyBtn = document.getElementById("applyBtn");
const downloadBtn = document.getElementById("downloadBtn");
let originalImage = null;

fileInput.onchange = e => {
    if (!e.target.files[0]) return;
    const img = new Image();
    img.onload = () => {
        originalImage = img;
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img,0,0);
        applyFilter();
        downloadBtn.disabled = false; // Enable download button once image is loaded
    };
    img.src = URL.createObjectURL(e.target.files[0]);
};

applyBtn.onclick = applyFilter;

// Download handler
downloadBtn.onclick = () => {
    if (!originalImage) return;
    
    const link = document.createElement("a");
    link.download = "redeye-filtered.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
};

function applyFilter() {
    if (!originalImage) return;

    const curveFactor  = document.getElementById("curve").value  / 100;
    const ditherFactor = document.getElementById("dither").value / 100;
    const noiseFactor  = document.getElementById("noise").value  / 100;

    const w = canvas.width;
    const h = canvas.height;

    ctx.drawImage(originalImage, 0, 0, w, h);

    let imgData = ctx.getImageData(0,0,w,h);
    let d = imgData.data;

    // 1) Grayscale conversion
    for (let i=0; i<d.length; i+=4) {
        let L = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
        d[i] = d[i+1] = d[i+2] = L;
    }

    // 2) Dithering using Atkinson Algorithm
    atkinsonDitherLuma(imgData, ditherFactor);

    // 3) Generate randomized red noise on the white pixels produced by dithering
    for (let i=0; i<d.length; i+=4) {
        if (d[i] === 255) {

            // Variable percentage red noise generation
            if (Math.random() < noiseFactor) {
                let c = Math.floor(Math.random()*3);
                if (c===0) { d[i]=255; d[i+1]=116; d[i+2]=92;  }
                if (c===1) { d[i]=255; d[i+1]=77;  d[i+2]=46;  }
                if (c===2) { d[i]=255; d[i+1]=40;  d[i+2]=0;   }
            }

            // If it doesn't become noise → temporarily keep it white
            else {
                d[i]   = 255;
                d[i+1] = 255;
                d[i+2] = 255;
            }
        }
    }

    // 4) Final color mapping: preserve white and red noise, convert black to pure cyan
    for (let i=0; i<d.length; i+=4) {

        // If it's red noise → skip (do not touch)
        if (d[i] === 255 && (d[i+1] === 116 || d[i+1] === 77 || d[i+1] === 40)) {
            continue;
        }

        // If it's pure white → skip (stays structural white)
        if (d[i] === 255 && d[i+1] === 255 && d[i+2] === 255) {
            continue;
        }

        // Otherwise it's black/dark → convert to pure cyan
        else {
            d[i]   = 0;
            d[i+1] = 221;
            d[i+2] = 255;
        }
    }

    // 5) Global curve adjustment (brightness)
    for (let i=0; i<d.length; i+=4) {
        d[i]   = Math.min(255, d[i]   * curveFactor);
        d[i+1] = Math.min(255, d[i+1] * curveFactor);
        d[i+2] = Math.min(255, d[i+2] * curveFactor);
    }

    ctx.putImageData(imgData,0,0);
}

// Atkinson Dithering Algorithm
function atkinsonDitherLuma(imgData, strength) {
    const w = imgData.width;
    const h = imgData.height;
    const d = imgData.data;

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            let i = (y * w + x) * 4;
            let old = d[i];
            let newVal = old < 128 ? 0 : 255;
            let err = (old - newVal) * strength;
            
            d[i] = d[i+1] = d[i+2] = newVal;

            let e = err / 8; 

            distribute(x + 1, y,     e);
            distribute(x + 2, y,     e);
            distribute(x - 1, y + 1, e);
            distribute(x,     y + 1, e);
            distribute(x + 1, y + 1, e);
            distribute(x,     y + 2, e);

            function distribute(nx, ny, e) {
                if (nx < 0 || nx >= w || ny < 0 || ny >= h) return;
                let j = (ny * w + nx) * 4;
                let v = d[j] + e;
                v = Math.max(0, Math.min(255, v));
                d[j] = d[j+1] = d[j+2] = v;
            }
        }
    }
}
</script>

</body>
</html>
